name: release-please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      # Set the RELEASE_PLEASE_TOKEN secret (fine-grained PAT or GitHub App token) once
      # required checks exist on main: PRs opened with the default token do not trigger
      # other workflows, so their checks would never run.
      - uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
