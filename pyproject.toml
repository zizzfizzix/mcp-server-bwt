[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp-server-bwt"
authors = [
  { name = "Kuba Serafinowski" },
]
description = "MCP server for Bing Webmaster Tools"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.13"
dynamic = ["version"]
keywords = ["mcp", "model-context-protocol", "bing", "bing-webmaster-tools", "seo"]

classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
]

dependencies = [
    "mcp[cli]>=2.2,<3",
    "bing-webmaster-tools"
]

[project.urls]
Homepage = "https://github.com/zizzfizzix/mcp-server-bwt"
Repository = "https://github.com/zizzfizzix/mcp-server-bwt"
Issues = "https://github.com/zizzfizzix/mcp-server-bwt/issues"
Changelog = "https://github.com/zizzfizzix/mcp-server-bwt/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
    "lefthook>=2.1.14",
    "mypy",
    "pytest",
    "ruff",
]

[tool.hatch.build.targets.wheel]
packages = ["mcp_server_bwt"]
exclude = ["mcp_server_bwt/test_*.py"]

[tool.hatch.build.targets.sdist]
include = ["mcp_server_bwt/", "README.md", "LICENSE", "CHANGELOG.md", "pyproject.toml"]

[tool.hatch.version]
path = "mcp_server_bwt/version.py"

[project.scripts]
mcp-server-bwt = "mcp_server_bwt.main:app"
mcp_server_bwt = "mcp_server_bwt.main:app"

[tool.pytest.ini_options]
pythonpath = "mcp_server_bwt"

[tool.mypy]
python_version = "3.13"
warn_return_any = true
warn_unused_configs = true
exclude = [
    ".+test_"
]
