[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp-server-bwt"
authors = [
  { name = "Kuba Serafinowski" },
  { name = "Andrea Galliani" },
]
description = "MCP server for Bing Webmaster Tools (fixed for ISO 8601 UTC dates and MCP v1/v2 compatibility)"
readme = "README.md"
requires-python = ">=3.10"
dynamic = ["version"]

classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

dependencies = [
    "mcp[cli]>=1.2.0,<2.0.0",
    "bing-webmaster-tools>=1.2.0",
]

[dependency-groups]
dev = [
    "mypy",
    "pytest",
    "pytest-asyncio>=1.4.0",
    "ruff",
]

[tool.hatch.build.targets.wheel]
packages = ["mcp_server_bwt"]

[tool.hatch.version]
path = "mcp_server_bwt/version.py"

[project.scripts]
mcp-server-bwt = "mcp_server_bwt.main:app"
mcp_server_bwt = "mcp_server_bwt.main:app"

[tool.pytest.ini_options]
pythonpath = "."

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
exclude = [
    ".+test_"
]
